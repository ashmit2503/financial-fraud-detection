[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fraud-monitor"
version = "0.1.0"
description = "Temporal fraud detection and model monitoring for the IEEE-CIS dataset"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "Ashmit" }]
dependencies = [
  "altair>=5.3,<7",
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "polars>=1.0,<2",
  "pyarrow>=15,<25",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.12,<2",
  "streamlit>=1.62,<2",
]

[project.optional-dependencies]
train = [
  "lightgbm>=4.3,<5",
  "llvmlite>=0.44,<1",
  "mlflow>=3.15.2,<4",
  "numba>=0.61,<1",
  "optuna>=3.6,<5",
  "shap>=0.46,<1",
]
dev = [
  "ipykernel>=6,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
fraud-monitor = "fraud_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_monitor"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
