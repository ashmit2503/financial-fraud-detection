name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,train,app]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Streamlit startup smoke test
        run: |
          streamlit run streamlit_app.py --server.headless=true --server.port=8501 >/tmp/streamlit.log 2>&1 &
          APP_PID=$!
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              kill "$APP_PID"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          kill "$APP_PID" || true
          exit 1
